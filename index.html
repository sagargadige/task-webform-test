            <script>
                function addAriaSelected1389003000000829001() {
                    var optionElem = event.target;

                    var previousSelectedOption =
                        optionElem.querySelector('[aria-selected=true]');

                    if (previousSelectedOption) {
                        previousSelectedOption.removeAttribute('aria-selected');
                    }

                    optionElem.querySelectorAll('option')[
                        optionElem.selectedIndex
                    ].ariaSelected = 'true';
                }

                function validateEmail1389003000000829001() {
                    var form =
                        document.forms[
                            'WebToLeads1389003000000829001'
                        ];

                    var emailFld =
                        form.querySelectorAll('[ftype=email]');

                    var i;

                    for (i = 0; i < emailFld.length; i++) {
                        var emailVal = emailFld[i].value;

                        if (
                            emailVal.replace(
                                /^\s+|\s+$/g,
                                ''
                            ).length != 0
                        ) {
                            var atpos = emailVal.indexOf('@');
                            var dotpos = emailVal.lastIndexOf('.');

                            if (
                                atpos < 1 ||
                                dotpos < atpos + 2 ||
                                dotpos + 2 >= emailVal.length
                            ) {
                                alert(
                                    'Please enter a valid email address.'
                                );

                                emailFld[i].focus();

                                return false;
                            }
                        }
                    }

                    return true;
                }

                function checkMandatory1389003000000829001(isAjax) {
                    var mndFileds =
                        new Array(
                            'Company',
                            'Last Name'
                        );

                    var fldLangVal =
                        new Array(
                            'Company',
                            'Last Name'
                        );

                    for (
                        i = 0;
                        i < mndFileds.length;
                        i++
                    ) {
                        var fieldObj =
                            document.forms[
                                'WebToLeads1389003000000829001'
                            ][mndFileds[i]];

                        if (fieldObj) {

                            if (
                                (
                                    fieldObj.value
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ''
                                ).length == 0
                            ) {

                                if (fieldObj.type == 'file') {
                                    alert(
                                        'Please select a file to upload.'
                                    );

                                    fieldObj.focus();

                                    return false;
                                }

                                alert(
                                    fldLangVal[i] +
                                    ' cannot be empty.'
                                );

                                fieldObj.focus();

                                return false;

                            } else if (
                                fieldObj.nodeName == 'SELECT'
                            ) {

                                if (
                                    fieldObj.options[
                                        fieldObj.selectedIndex
                                    ].value == '-None-'
                                ) {
                                    alert(
                                        fldLangVal[i] +
                                        ' cannot be none.'
                                    );

                                    fieldObj.focus();

                                    return false;
                                }

                            } else if (
                                fieldObj.type == 'checkbox'
                            ) {

                                if (
                                    fieldObj.checked == false
                                ) {
                                    alert(
                                        'Please accept ' +
                                        fldLangVal[i]
                                    );

                                    fieldObj.focus();

                                    return false;
                                }
                            }

                            try {
                                if (
                                    fieldObj.name ==
                                    'Last Name'
                                ) {
                                    name = fieldObj.value;
                                }
                            } catch (e) {}
                        }
                    }

                    if (
                        !validateEmail1389003000000829001()
                    ) {
                        return false;
                    }

                    var urlparams =
                        new URLSearchParams(
                            window.location.search
                        );

                    if (
                        urlparams.has('service') &&
                        urlparams.get('service') ===
                            'smarturl'
                    ) {
                        var webform =
                            document.getElementById(
                                'webform1389003000000829001'
                            );

                        var service =
                            urlparams.get('service');

                        var smarturlfield =
                            document.createElement(
                                'input'
                            );

                        smarturlfield.setAttribute(
                            'type',
                            'hidden'
                        );

                        smarturlfield.setAttribute(
                            'value',
                            service
                        );

                        smarturlfield.setAttribute(
                            'name',
                            'service'
                        );

                        webform.appendChild(
                            smarturlfield
                        );
                    }

                    document
                        .querySelector(
                            '.crmWebToEntityForm .formsubmit'
                        )
                        .setAttribute(
                            'disabled',
                            true
                        );
                }

                function captchaFailedHandling1389003000000829001(
                    message
                ) {
                    var capErr =
                        document.getElementById(
                            'captchaErr1389003000000829001'
                        );

                    capErr.innerHTML = message;
                    capErr.style.visibility = 'visible';

                    var capFld =
                        document.getElementById(
                            'captchaField1389003000000829001'
                        );

                    capFld.focus();

                    setTimeout(
                        function () {
                            capErr.style.visibility =
                                'hidden';
                        },
                        5000
                    );
                }

                document
                    .getElementById(
                        'webform1389003000000829001'
                    )
                    .addEventListener(
                        'submit',
                        function (e) {

                            var ismandatory =
                                checkMandatory1389003000000829001(
                                    true
                                );

                            e.preventDefault();

                            if (
                                ismandatory === undefined ||
                                ismandatory
                            ) {

                                if (
                                    typeof _wfa_track !==
                                        'undefined' &&
                                    _wfa_track.wfa_submit
                                ) {
                                    _wfa_track.wfa_submit(e);
                                }

                                var formData =
                                    new FormData(this);

                                fetch(
                                    'https://crm.zoho.in/crm/WebToLeadForm',
                                    {
                                        method: 'POST',
                                        body: formData,
                                        cache: 'no-cache'
                                    }
                                )
                                    .then(
                                        response => {
                                            const contentType =
                                                response.headers.get(
                                                    'Content-Type'
                                                );

                                            return contentType.includes(
                                                'application/json'
                                            )
                                                ? response.json()
                                                : response.text();
                                        }
                                    )
                                    .then(data => {

                                        if (
                                            typeof data ===
                                            'object'
                                        ) {

                                            if (
                                                data.actionsubmit ===
                                                'Splash Message'
                                            ) {

                                                if (
                                                    data.invalidCaptcha &&
                                                    data.invalidCaptcha ==
                                                        'true'
                                                ) {

                                                    captchaFailedHandling1389003000000829001(
                                                        data.actionvalue
                                                    );

                                                } else {

                                                    if (
                                                        typeof reloadImg1389003000000829001 !==
                                                        'undefined'
                                                    ) {
                                                        reloadImg1389003000000829001();
                                                    }

                                                    var splashinfodom =
                                                        document.getElementById(
                                                            'wf_splash_info'
                                                        );

                                                    splashinfodom.innerText =
                                                        data.actionvalue;

                                                    var splashdom =
                                                        document.getElementById(
                                                            'wf_splash'
                                                        );

                                                    if (
                                                        splashinfodom
                                                    ) {

                                                        document
                                                            .getElementById(
                                                                'webform1389003000000829001'
                                                            )
                                                            .reset.click();

                                                        splashdom.style.display =
                                                            '';

                                                        setTimeout(
                                                            function () {
                                                                splashdom.style.display =
                                                                    'none';
                                                            },
                                                            5000
                                                        );
                                                    }

                                                    if (
                                                        typeof _wfa_track !=
                                                            'undefined' &&
                                                        _wfa_track.wfa_post_submit
                                                    ) {
                                                        _wfa_track.wfa_post_submit(
                                                            e
                                                        );
                                                    }
                                                }

                                            } else if (
                                                data.actionsubmit ===
                                                    'redirect_url' ||
                                                data.actionsubmit ===
                                                    'parent_redirect'
                                            ) {

                                                if (
                                                    data.success
                                                ) {

                                                    if (
                                                        typeof _wfa_track !==
                                                            'undefined' &&
                                                        _wfa_track.wfa_post_submit
                                                    ) {
                                                        _wfa_track.wfa_post_submit(
                                                            e
                                                        );
                                                    }

                                                    if (
                                                        typeof historyBack1389003000000829001 !==
                                                        'undefined'
                                                    ) {
                                                        window.addEventListener(
                                                            'focus',
                                                            historyBack1389003000000829001
                                                        );
                                                    }
                                                }

                                                if (
                                                    data.actionsubmit ===
                                                    'redirect_url'
                                                ) {

                                                    window.location.assign(
                                                        data.redirectUrl
                                                    );

                                                } else if (
                                                    data.actionsubmit ===
                                                    'parent_redirect'
                                                ) {

                                                    parent.window.location =
                                                        data.redirectUrl;
                                                }

                                            } else if (
                                                data.actionsubmit ===
                                                'parent_redirect'
                                            ) {

                                                parent.window.location =
                                                    data.redirectUrl;

                                            } else if (
                                                data.actionsubmit ===
                                                'add_hash'
                                            ) {

                                                document.location.hash =
                                                    data.hash;

                                            } else if (
                                                data.actionsubmit ===
                                                'error_msg'
                                            ) {

                                                alert(
                                                    data.message
                                                );

                                            } else if (
                                                data.invalidCaptcha &&
                                                data.invalidCaptcha ===
                                                    'true'
                                            ) {

                                                captchaFailedHandling1389003000000829001(
                                                    data.actionvalue
                                                );

                                                if (
                                                    data.extraAction ===
                                                    'parent_signal'
                                                ) {
                                                    window.parent.postMessage(
                                                        'checkCaptchaError',
                                                        '*'
                                                    );
                                                }

                                            } else if (
